<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="bBody" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="bOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="lensRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="sensorGlass" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#0F172A" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="drop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Backdrop Canvas -->
  <rect width="320" height="200" rx="14" fill="url(#bgG)"/>
  
  <!-- Technical Grid Pattern Background -->
  <g opacity="0.18" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="2 3">
    <line x1="20" y1="50" x2="300" y2="50"/>
    <line x1="20" y1="100" x2="300" y2="100"/>
    <line x1="20" y1="150" x2="300" y2="150"/>
    <line x1="80" y1="20" x2="80" y2="180"/>
    <line x1="160" y1="20" x2="160" y2="180"/>
    <line x1="240" y1="20" x2="240" y2="180"/>
  </g>

  <!-- Camera Body Shadow & Main Block -->
  <g filter="url(#drop)">
    <!-- Main Camera Cube -->
    <rect x="75" y="42" width="116" height="116" rx="12" fill="url(#bBody)" stroke="#94A3B8" stroke-width="1.2"/>
    
    <!-- Top Chamfer Edge -->
    <path d="M75 54 Q75 42 87 42 L179 42 Q191 42 191 54" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Basler Signature Orange Accent Stripe -->
    <rect x="75" y="68" width="116" height="9" fill="url(#bOrange)"/>
    
    <!-- Heatsink / Side Recesses -->
    <rect x="80" y="88" width="5" height="42" rx="2" fill="#94A3B8" opacity="0.6"/>
    <rect x="88" y="88" width="5" height="42" rx="2" fill="#94A3B8" opacity="0.4"/>
    
    <!-- Brand Label -->
    <text x="133" y="63" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#092C47" text-anchor="middle" letter-spacing="1.5">BASLER</text>
    <text x="133" y="96" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#64748B" text-anchor="middle">ace 2 &#8226; Sony IMX</text>

    <!-- C-Mount Lens Barrel Extending Right -->
    <rect x="189" y="62" width="34" height="76" rx="4" fill="url(#lensRing)" stroke="#475569" stroke-width="1"/>
    
    <!-- Lens Ridges / Knurled Focus Ring -->
    <line x1="195" y1="62" x2="195" y2="138" stroke="#64748B" stroke-width="1.5"/>
    <line x1="201" y1="62" x2="201" y2="138" stroke="#475569" stroke-width="1.5"/>
    <line x1="207" y1="62" x2="207" y2="138" stroke="#64748B" stroke-width="1.5"/>
    <line x1="213" y1="62" x2="213" y2="138" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Front Lens Bezel -->
    <ellipse cx="223" cy="100" rx="10" ry="34" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <ellipse cx="223" cy="100" rx="6" ry="24" fill="url(#sensorGlass)"/>
    <ellipse cx="221" cy="94" rx="2" ry="9" fill="#FFFFFF" opacity="0.6"/>
    
    <!-- Status LED & Connector Ports -->
    <circle cx="88" cy="142" r="3.5" fill="#10B981"/>
    <circle cx="88" cy="142" r="1.5" fill="#FFFFFF"/>
    <rect x="100" y="139" width="16" height="7" rx="1.5" fill="#334155"/>
    <text x="120" y="145" font-family="monospace" font-size="7" fill="#64748B">USB 3.0</text>
  </g>

  <!-- Optical Calibration Reticle Markings -->
  <g stroke="#0284C7" stroke-width="1.2" opacity="0.75">
    <path d="M25 35 L35 35 L35 45"/>
    <path d="M295 35 L285 35 L285 45"/>
    <path d="M25 165 L35 165 L35 155"/>
    <path d="M295 165 L285 165 L285 155"/>
  </g>
</svg>

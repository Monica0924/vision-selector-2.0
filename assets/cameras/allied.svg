<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="alliedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="alliedBody" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="alliedBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="alliedDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="14" fill="url(#alliedBg)"/>
  
  <g opacity="0.18" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="2 3">
    <line x1="20" y1="50" x2="300" y2="50"/>
    <line x1="20" y1="100" x2="300" y2="100"/>
    <line x1="20" y1="150" x2="300" y2="150"/>
    <line x1="80" y1="20" x2="80" y2="180"/>
    <line x1="160" y1="20" x2="160" y2="180"/>
    <line x1="240" y1="20" x2="240" y2="180"/>
  </g>

  <g filter="url(#alliedDrop)">
    <!-- Compact Alvium Modular Body -->
    <rect x="76" y="44" width="114" height="114" rx="8" fill="url(#alliedBody)" stroke="#64748B" stroke-width="1.2"/>
    <rect x="76" y="44" width="114" height="6" fill="url(#alliedBlue)"/>

    <!-- Heat Dissipation Ribs -->
    <rect x="80" y="60" width="10" height="78" rx="2" fill="#1E293B"/>
    <line x1="85" y1="64" x2="85" y2="134" stroke="#475569" stroke-width="1.5"/>

    <text x="138" y="76" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ALLIED VISION</text>
    <text x="138" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#94A3B8" text-anchor="middle">Alvium &#8226; Mako GigE</text>

    <!-- C-Mount Lens -->
    <rect x="188" y="62" width="34" height="78" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <line x1="194" y1="62" x2="194" y2="140" stroke="#64748B" stroke-width="1.5"/>
    <line x1="202" y1="62" x2="202" y2="140" stroke="#475569" stroke-width="1.5"/>
    <line x1="210" y1="62" x2="210" y2="140" stroke="#64748B" stroke-width="1.5"/>

    <!-- Lens Element -->
    <ellipse cx="222" cy="101" rx="9" ry="34" fill="#020617" stroke="#38BDF8" stroke-width="1.5"/>
    <ellipse cx="222" cy="101" rx="5" ry="22" fill="#0284C7" opacity="0.85"/>
    <ellipse cx="220" cy="94" rx="2" ry="8" fill="#FFFFFF" opacity="0.6"/>

    <!-- Connector & Diagnostic LED -->
    <circle cx="102" cy="140" r="3" fill="#10B981"/>
    <rect x="114" y="137" width="20" height="6.5" rx="1" fill="#0F172A" stroke="#64748B" stroke-width="0.8"/>
    <text x="142" y="143" font-family="monospace" font-size="6.5" fill="#94A3B8">GigE PoE</text>
  </g>

  <g stroke="#2563EB" stroke-width="1.2" opacity="0.75">
    <path d="M25 35 L35 35 L35 45"/>
    <path d="M295 35 L285 35 L285 45"/>
    <path d="M25 165 L35 165 L35 155"/>
    <path d="M295 165 L285 165 L285 155"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="jaiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="jaiBody" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="jaiGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="jaiDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="14" fill="url(#jaiBg)"/>
  
  <g opacity="0.18" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="2 3">
    <line x1="20" y1="50" x2="300" y2="50"/>
    <line x1="20" y1="100" x2="300" y2="100"/>
    <line x1="20" y1="150" x2="300" y2="150"/>
    <line x1="80" y1="20" x2="80" y2="180"/>
    <line x1="160" y1="20" x2="160" y2="180"/>
    <line x1="240" y1="20" x2="240" y2="180"/>
  </g>

  <g filter="url(#jaiDrop)">
    <!-- JAI High-Speed Prism & Area Scan Chassis -->
    <rect x="74" y="44" width="116" height="114" rx="10" fill="url(#jaiBody)" stroke="#475569" stroke-width="1.2"/>
    <rect x="74" y="44" width="116" height="5" fill="url(#jaiGold)"/>

    <text x="133" y="78" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">JAI</text>
    <text x="133" y="93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#94A3B8" text-anchor="middle">Spark &#8226; Go &#8226; Sweep</text>
    <text x="133" y="105" font-family="monospace" font-size="7" fill="#F59E0B" text-anchor="middle">Prism-Based High Speed</text>

    <!-- C/F-Mount Lens -->
    <rect x="190" y="58" width="36" height="86" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <line x1="198" y1="58" x2="198" y2="144" stroke="#64748B" stroke-width="1.5"/>
    <line x1="206" y1="58" x2="206" y2="144" stroke="#475569" stroke-width="1.5"/>
    <line x1="214" y1="58" x2="214" y2="144" stroke="#64748B" stroke-width="1.5"/>

    <ellipse cx="226" cy="101" rx="10" ry="39" fill="#020617" stroke="#F59E0B" stroke-width="1.5"/>
    <ellipse cx="226" cy="101" rx="6" ry="26" fill="#0284C7"/>
    <ellipse cx="224" cy="94" rx="2" ry="9" fill="#FFFFFF" opacity="0.6"/>

    <circle cx="94" cy="140" r="3" fill="#10B981"/>
    <rect x="108" y="136" width="20" height="7" rx="1.5" fill="#334155"/>
    <text x="138" y="142" font-family="monospace" font-size="6.5" fill="#94A3B8">CoaXPress / GigE</text>
  </g>

  <g stroke="#F59E0B" stroke-width="1.2" opacity="0.75">
    <path d="M25 35 L35 35 L35 45"/>
    <path d="M295 35 L285 35 L285 45"/>
    <path d="M25 165 L35 165 L35 155"/>
    <path d="M295 165 L285 165 L285 155"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="lucidBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="lucidBlue" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="lucidSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="lucidDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="14" fill="url(#lucidBg)"/>
  
  <g opacity="0.18" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="2 3">
    <line x1="20" y1="50" x2="300" y2="50"/>
    <line x1="20" y1="100" x2="300" y2="100"/>
    <line x1="20" y1="150" x2="300" y2="150"/>
    <line x1="80" y1="20" x2="80" y2="180"/>
    <line x1="160" y1="20" x2="160" y2="180"/>
    <line x1="240" y1="20" x2="240" y2="180"/>
  </g>

  <g filter="url(#lucidDrop)">
    <!-- Triton IP67 Rugged Anodized Blue Enclosure -->
    <rect x="74" y="44" width="116" height="114" rx="10" fill="url(#lucidBlue)" stroke="#0284C7" stroke-width="1.2"/>

    <!-- IP67 Sealed Edge Gasket -->
    <rect x="74" y="44" width="116" height="114" rx="10" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>
    
    <!-- Heavy Duty Corner Screws -->
    <circle cx="84" cy="56" r="3" fill="url(#lucidSteel)"/>
    <circle cx="180" cy="56" r="3" fill="url(#lucidSteel)"/>
    <circle cx="84" cy="146" r="3" fill="url(#lucidSteel)"/>
    <circle cx="180" cy="146" r="3" fill="url(#lucidSteel)"/>

    <text x="132" y="78" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">LUCID</text>
    <text x="132" y="93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#E0F2FE" text-anchor="middle">Triton IP67 &#8226; Helios 3D</text>
    <rect x="110" y="100" width="44" height="14" rx="4" fill="#0369A1" stroke="#38BDF8" stroke-width="0.8"/>
    <text x="132" y="110" font-family="monospace" font-size="7" font-weight="bold" fill="#38BDF8" text-anchor="middle">IP67 RATED</text>

    <!-- Sealed Stainless Lens Barrel Extension -->
    <rect x="188" y="60" width="36" height="82" rx="4" fill="url(#lucidSteel)" stroke="#475569" stroke-width="1"/>
    <line x1="196" y1="60" x2="196" y2="142" stroke="#475569" stroke-width="1.5"/>
    <line x1="204" y1="60" x2="204" y2="142" stroke="#334155" stroke-width="1.5"/>
    <line x1="212" y1="60" x2="212" y2="142" stroke="#475569" stroke-width="1.5"/>

    <!-- Lens Front & Aperture -->
    <ellipse cx="224" cy="101" rx="10" ry="37" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <ellipse cx="224" cy="101" rx="6" ry="25" fill="#0284C7"/>
    <ellipse cx="222" cy="94" rx="2" ry="9" fill="#FFFFFF" opacity="0.7"/>

    <!-- Sealed M12 Connector -->
    <circle cx="94" cy="140" r="3" fill="#10B981"/>
    <rect x="106" y="136" width="18" height="8" rx="2" fill="#0F172A" stroke="#94A3B8" stroke-width="0.8"/>
    <text x="134" y="143" font-family="monospace" font-size="7" fill="#E0F2FE">M12 PoE</text>
  </g>

  <g stroke="#0284C7" stroke-width="1.2" opacity="0.8">
    <path d="M25 35 L35 35 L35 45"/>
    <path d="M295 35 L285 35 L285 45"/>
    <path d="M25 165 L35 165 L35 155"/>
    <path d="M295 165 L285 165 L285 155"/>
  </g>
</svg>

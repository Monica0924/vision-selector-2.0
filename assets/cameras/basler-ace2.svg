<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Basler ace 2 camera</title>
  <desc id="desc">Illustration of a Basler ace 2 industrial camera.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
    <linearGradient id="body" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
    <radialGradient id="lens"><stop stop-color="#38bdf8"/><stop offset=".45" stop-color="#0f172a"/><stop offset="1" stop-color="#020617"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity=".18"/></filter>
  </defs>
  <rect width="640" height="400" rx="26" fill="url(#bg)"/>
  <g opacity=".18" stroke="#64748b" stroke-dasharray="5 7"><path d="M40 100h560M40 200h560M40 300h560M160 35v330M320 35v330M480 35v330"/></g>
  <g filter="url(#shadow)">
    <rect x="150" y="75" width="270" height="250" rx="25" fill="url(#body)" stroke="#94a3b8" stroke-width="4"/>
    <rect x="150" y="130" width="270" height="20" fill="#f58220"/>
    <text x="285" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#092c47" letter-spacing="3">BASLER</text>
    <text x="285" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">ace 2</text>
    <rect x="420" y="125" width="90" height="150" rx="12" fill="#1e293b" stroke="#475569" stroke-width="4"/>
    <ellipse cx="515" cy="200" rx="30" ry="69" fill="#020617" stroke="#38bdf8" stroke-width="5"/>
    <ellipse cx="515" cy="200" rx="19" ry="52" fill="url(#lens)"/>
    <circle cx="185" cy="286" r="9" fill="#10b981"/>
    <rect x="215" y="278" width="50" height="16" rx="3" fill="#334155"/>
  </g>
  <text x="320" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#64748b">10GigE industrial area scan camera</text>
</svg>

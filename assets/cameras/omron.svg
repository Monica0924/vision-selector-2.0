<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="omronBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="omronBody" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="ringLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="85%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>
    <filter id="omronDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="14" fill="url(#omronBg)"/>
  
  <g opacity="0.18" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="2 3">
    <line x1="20" y1="50" x2="300" y2="50"/>
    <line x1="20" y1="100" x2="300" y2="100"/>
    <line x1="20" y1="150" x2="300" y2="150"/>
    <line x1="80" y1="20" x2="80" y2="180"/>
    <line x1="160" y1="20" x2="160" y2="180"/>
    <line x1="240" y1="20" x2="240" y2="180"/>
  </g>

  <g filter="url(#omronDrop)">
    <!-- Main Smart Camera Chassis -->
    <rect x="65" y="45" width="105" height="110" rx="14" fill="url(#omronBody)" stroke="#475569" stroke-width="1.2"/>

    <!-- Heat sink grooves on back -->
    <rect x="65" y="60" width="8" height="80" rx="2" fill="#334155" opacity="0.8"/>
    <line x1="78" y1="65" x2="78" y2="135" stroke="#475569" stroke-width="2"/>
    <line x1="84" y1="65" x2="84" y2="135" stroke="#334155" stroke-width="2"/>

    <!-- Omron Brand & Model -->
    <text x="122" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="1.2">OMRON</text>
    <text x="122" y="84" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#94A3B8" text-anchor="middle">FHV7 Smart Series</text>
    <text x="122" y="96" font-family="monospace" font-size="7.5" fill="#64748B" text-anchor="middle">Embedded Vision AI</text>

    <!-- Status Indicators -->
    <circle cx="100" cy="140" r="3.5" fill="#10B981"/>
    <circle cx="114" cy="140" r="3.5" fill="#F59E0B"/>
    <circle cx="128" cy="140" r="3.5" fill="#0284C7"/>
    <text x="114" y="148" font-family="monospace" font-size="6" fill="#64748B" text-anchor="middle">PWR / RUN / ERR</text>

    <!-- Integrated Multi-Color Ring Light & Lens Hood Extension -->
    <rect x="168" y="52" width="40" height="96" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    
    <!-- Large Front Optical Bezel with High-Intensity Ring Light -->
    <ellipse cx="210" cy="100" rx="14" ry="46" fill="url(#ringLight)" stroke="#0284C7" stroke-width="2"/>
    
    <!-- LED Emitter Segments in Ring Light -->
    <g fill="#FFFFFF" opacity="0.9">
      <ellipse cx="210" cy="62" rx="3" ry="4"/>
      <ellipse cx="210" cy="74" rx="3" ry="4"/>
      <ellipse cx="210" cy="86" rx="3" ry="4"/>
      <ellipse cx="210" cy="98" rx="3" ry="4"/>
      <ellipse cx="210" cy="110" rx="3" ry="4"/>
      <ellipse cx="210" cy="122" rx="3" ry="4"/>
      <ellipse cx="210" cy="134" rx="3" ry="4"/>
    </g>

    <!-- Center Autofocus Lens Element -->
    <ellipse cx="211" cy="100" rx="7" ry="24" fill="#020617" stroke="#38BDF8" stroke-width="1.2"/>
    <ellipse cx="211" cy="100" rx="4" ry="16" fill="#0284C7" opacity="0.8"/>
    <ellipse cx="209" cy="94" rx="2" ry="7" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- Precision Crosshair Markings -->
  <g stroke="#0284C7" stroke-width="1.2" opacity="0.8">
    <path d="M25 35 L35 35 L35 45"/>
    <path d="M295 35 L285 35 L285 45"/>
    <path d="M25 165 L35 165 L35 155"/>
    <path d="M295 165 L285 165 L285 155"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Basler blaze ToF camera</title>
  <desc id="desc">Illustration of a Basler blaze time-of-flight camera.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>
    <linearGradient id="body" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
    <radialGradient id="lens"><stop stop-color="#67e8f9"/><stop offset=".5" stop-color="#0e7490"/><stop offset="1" stop-color="#082f49"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity=".18"/></filter>
  </defs>
  <rect width="640" height="400" rx="26" fill="url(#bg)"/>
  <g opacity=".22" stroke="#0284c7" stroke-dasharray="5 7"><path d="M40 100h560M40 200h560M40 300h560M160 35v330M320 35v330M480 35v330"/></g>
  <g filter="url(#shadow)">
    <rect x="145" y="80" width="350" height="240" rx="28" fill="url(#body)" stroke="#94a3b8" stroke-width="4"/>
    <rect x="145" y="135" width="350" height="20" fill="#f58220"/>
    <text x="320" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#092c47" letter-spacing="3">BASLER</text>
    <text x="320" y="188" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#475569">blaze ToF</text>
    <circle cx="320" cy="242" r="49" fill="#020617" stroke="#0891b2" stroke-width="7"/>
    <circle cx="320" cy="242" r="34" fill="url(#lens)"/>
    <circle cx="307" cy="230" r="8" fill="#cffafe" opacity=".8"/>
    <circle cx="178" cy="282" r="9" fill="#10b981"/>
    <rect x="205" y="274" width="62" height="16" rx="3" fill="#334155"/>
  </g>
  <text x="320" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#64748b">GigE time-of-flight depth camera</text>
</svg>

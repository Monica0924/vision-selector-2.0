<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="phoxiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="phoxiBar" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="phoxiDrop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="320" height="200" rx="14" fill="url(#phoxiBg)"/>
  
  <g opacity="0.18" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="2 3">
    <line x1="20" y1="50" x2="300" y2="50"/>
    <line x1="20" y1="100" x2="300" y2="100"/>
    <line x1="20" y1="150" x2="300" y2="150"/>
    <line x1="80" y1="20" x2="80" y2="180"/>
    <line x1="160" y1="20" x2="160" y2="180"/>
    <line x1="240" y1="20" x2="240" y2="180"/>
  </g>

  <g filter="url(#phoxiDrop)">
    <!-- PhoXi Carbon / Magnesium Optical Bar (Extended Baseline) -->
    <rect x="42" y="65" width="236" height="70" rx="10" fill="url(#phoxiBar)" stroke="#475569" stroke-width="1.2"/>

    <!-- Dual Optical Heads: High Resolution Sensor Head on Left -->
    <circle cx="82" cy="100" r="22" fill="#020617" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="82" cy="100" r="14" fill="#0369A1"/>
    <ellipse cx="80" cy="94" rx="4" ry="7" fill="#FFFFFF" opacity="0.6"/>
    <text x="82" y="130" font-family="monospace" font-size="6.5" font-weight="bold" fill="#38BDF8" text-anchor="middle">3D CAMERA</text>

    <!-- Structured Light Pattern Projector on Right -->
    <circle cx="238" cy="100" r="22" fill="#020617" stroke="#818CF8" stroke-width="1.5"/>
    <rect x="228" y="90" width="20" height="20" rx="3" fill="#312E81" stroke="#A5B4FC" stroke-width="1"/>
    <line x1="233" y1="90" x2="233" y2="110" stroke="#818CF8" stroke-width="1.5"/>
    <line x1="238" y1="90" x2="238" y2="110" stroke="#818CF8" stroke-width="1.5"/>
    <line x1="243" y1="90" x2="243" y2="110" stroke="#818CF8" stroke-width="1.5"/>
    <text x="238" y="130" font-family="monospace" font-size="6.5" font-weight="bold" fill="#818CF8" text-anchor="middle">PROJECTOR</text>

    <!-- Brand Identity & Precision Status -->
    <text x="160" y="93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.2">PHOTONEO</text>
    <text x="160" y="107" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="600" fill="#94A3B8" text-anchor="middle">PhoXi&#174; 3D Structured Light</text>

    <!-- Center Rigid Carbon Strut Pattern -->
    <line x1="120" y1="74" x2="200" y2="74" stroke="#475569" stroke-width="2"/>
    <circle cx="160" cy="118" r="3" fill="#10B981"/>
    <text x="160" y="127" font-family="monospace" font-size="6.5" fill="#10B981" text-anchor="middle">CALIBRATED &#8226; READY</text>
  </g>

  <!-- Structured Light Grid Projection Effect -->
  <g stroke="#818CF8" stroke-width="0.8" opacity="0.6">
    <line x1="238" y1="122" x2="210" y2="175"/>
    <line x1="238" y1="122" x2="238" y2="175"/>
    <line x1="238" y1="122" x2="265" y2="175"/>
  </g>
</svg>
